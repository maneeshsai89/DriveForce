<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Agentforce WhatsApp Warranty Claim Intake</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;padding:1.5rem;color:#111;}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;}
.panel-label{font-size:11px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:0.05em;margin:0 0 8px;}
.phone-shell{background:#e5ddd5;border-radius:16px;overflow:hidden;border:1px solid #ccc;}
.wa-header{background:#075e54;padding:10px 14px;display:flex;align-items:center;gap:10px;}
.wa-avatar{width:32px;height:32px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0;}
.wa-name{font-size:13px;font-weight:600;color:#fff;margin:0;}
.wa-status{font-size:11px;color:rgba(255,255,255,0.8);margin:0;}
.wa-body{padding:12px 10px;display:flex;flex-direction:column;gap:6px;background:#e5ddd5;min-height:420px;}
.msg{max-width:82%;padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.45;}
.msg-agent{background:#fff;color:#111;border-radius:2px 8px 8px 8px;align-self:flex-start;}
.msg-dealer{background:#dcf8c6;color:#111;border-radius:8px 2px 8px 8px;align-self:flex-end;}
.msg-wrap{display:flex;flex-direction:column;}
.msg-wrap.dealer{align-items:flex-end;}
.msg-time{font-size:10px;color:#999;margin-top:2px;}
.msg-tag{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;margin-bottom:4px;}
.tag-auto{background:#E1F5EE;color:#085041;}
.tag-agent{background:#EEEDFE;color:#3C3489;}
.sf-panel{display:flex;flex-direction:column;gap:10px;}
.sf-card{background:#fff;border:1px solid #ddd;border-radius:10px;overflow:hidden;}
.sf-card-header{padding:8px 12px;border-bottom:1px solid #eee;font-size:11px;font-weight:600;color:#555;display:flex;align-items:center;justify-content:space-between;}
.sf-fields{padding:10px 12px;display:flex;flex-direction:column;gap:6px;}
.sf-row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.sf-label{font-size:11px;color:#888;flex-shrink:0;}
.sf-val{font-size:12px;font-weight:600;color:#111;text-align:right;}
.sf-val.prefilled{color:#2e844a;}
.sf-val.captured{color:#0070d2;}
.sf-val.pending{color:#aaa;font-weight:400;font-style:italic;}
.badge{font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;}
.badge-auto{background:#E1F5EE;color:#085041;}
.badge-conv{background:#E6F1FB;color:#0070d2;}
.progress-bar-wrap{height:4px;background:#eee;border-radius:2px;margin:4px 12px 10px;}
.progress-bar{height:4px;border-radius:2px;background:#25d366;}
.step-nav{display:flex;gap:8px;margin-top:12px;}
.step-btn{flex:1;font-size:12px;padding:8px;cursor:pointer;border-radius:8px;border:1px solid #ddd;background:#fff;color:#555;}
.step-btn:hover{background:#f5f5f5;}
.step-btn.primary{background:#075e54;color:#fff;border-color:#075e54;}
.step-btn:disabled{opacity:0.35;cursor:default;}
.insight-chip{background:#f8f8f8;border-radius:8px;padding:8px 12px;font-size:11px;color:#555;line-height:1.5;border:1px solid #eee;}
.insight-lbl{font-size:11px;font-weight:600;color:#333;margin-bottom:3px;}
.step-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.step-title{font-size:13px;font-weight:600;color:#111;}
.step-pct{font-size:11px;color:#888;}
.claim-banner{background:#EAF3DE;border-radius:8px;padding:8px 12px;margin-top:8px;display:flex;align-items:center;gap:8px;}
.claim-dot{width:8px;height:8px;border-radius:50%;background:#3B6D11;flex-shrink:0;}
.claim-txt{font-size:12px;font-weight:600;color:#27500A;}
</style>
</head>
<body>

<div id="root"></div>

<script>
const steps = [
  {
    title:"Step 1 of 5 — Dealer sends VIN",
    progress:20,
    conversation:[
      {role:"agent",tag:"agentforce",text:"Hi! I'm the Electra warranty claim assistant. To get started, please share the vehicle's VIN number."},
      {role:"dealer",text:"Hi — VIN is WBA3A5G59DNP26858"},
      {role:"agent",tag:"auto-lookup",text:"Got it. I'm looking that up in our records now..."}
    ],
    fields:[
      {label:"VIN",val:"WBA3A5G59DNP26858",state:"captured"},
      {label:"Vehicle model",val:"Fetching...",state:"pending"},
      {label:"Model year",val:"Fetching...",state:"pending"},
      {label:"Warranty status",val:"Fetching...",state:"pending"},
      {label:"Dealer account",val:"Fetching...",state:"pending"},
      {label:"Mileage at claim",val:"—",state:"pending"},
      {label:"Fault description",val:"—",state:"pending"},
      {label:"Part number",val:"—",state:"pending"},
      {label:"Labour hours",val:"—",state:"pending"},
    ],
    insight:"The agent receives the VIN from the dealer's WhatsApp message. Agentforce immediately triggers an Automotive Cloud lookup action — no manual search required."
  },
  {
    title:"Step 2 of 5 — Automotive Cloud pre-fill",
    progress:40,
    conversation:[
      {role:"agent",tag:"agentforce",text:"Hi! I'm the Electra warranty claim assistant. To get started, please share the vehicle's VIN number."},
      {role:"dealer",text:"Hi — VIN is WBA3A5G59DNP26858"},
      {role:"agent",tag:"auto-lookup",text:"Got it. I've found the vehicle in our system:\n\n• Electra E-Pulse 300 · 2022\n• Warranty: Active (expires Dec 2025)\n• Dealer: Sunrise Motors, Mumbai\n\nAll confirmed — no need to re-enter these. What fault is the vehicle experiencing?"}
    ],
    fields:[
      {label:"VIN",val:"WBA3A5G59DNP26858",state:"prefilled"},
      {label:"Vehicle model",val:"Electra E-Pulse 300",state:"prefilled"},
      {label:"Model year",val:"2022",state:"prefilled"},
      {label:"Warranty status",val:"Active — expires Dec 2025",state:"prefilled"},
      {label:"Dealer account",val:"Sunrise Motors, Mumbai",state:"prefilled"},
      {label:"Mileage at claim",val:"—",state:"pending"},
      {label:"Fault description",val:"—",state:"pending"},
      {label:"Part number",val:"—",state:"pending"},
      {label:"Labour hours",val:"—",state:"pending"},
    ],
    insight:"5 fields pre-filled from Automotive Cloud automatically. The agent skips asking for model, year, dealer name, and warranty status entirely."
  },
  {
    title:"Step 3 of 5 — Dealer describes fault",
    progress:60,
    conversation:[
      {role:"agent",tag:"auto-lookup",text:"Electra E-Pulse 300 · 2022 · Warranty active. What fault is the vehicle experiencing?"},
      {role:"dealer",text:"The battery range dropped by about 40% in the last week. Current mileage is 28,450 km."},
      {role:"agent",tag:"agentforce",text:"Understood — battery range degradation at 28,450 km. The most likely covered component is the High-Voltage Battery Pack (Part #EV-HVB-3201). Is this the part you're planning to replace?"}
    ],
    fields:[
      {label:"VIN",val:"WBA3A5G59DNP26858",state:"prefilled"},
      {label:"Vehicle model",val:"Electra E-Pulse 300",state:"prefilled"},
      {label:"Model year",val:"2022",state:"prefilled"},
      {label:"Warranty status",val:"Active — expires Dec 2025",state:"prefilled"},
      {label:"Dealer account",val:"Sunrise Motors, Mumbai",state:"prefilled"},
      {label:"Mileage at claim",val:"28,450 km",state:"captured"},
      {label:"Fault description",val:"Battery range degradation ~40%",state:"captured"},
      {label:"Part number",val:"EV-HVB-3201 (AI suggested)",state:"captured"},
      {label:"Labour hours",val:"—",state:"pending"},
    ],
    insight:"The agent extracts mileage and fault from natural language, then suggests the most likely part from the Electra parts catalogue. The dealer just confirms — no lookup required."
  },
  {
    title:"Step 4 of 5 — Dealer confirms, agent captures labour",
    progress:80,
    conversation:[
      {role:"agent",tag:"agentforce",text:"Is the High-Voltage Battery Pack (Part #EV-HVB-3201) the part you're replacing?"},
      {role:"dealer",text:"Yes, that's the one. Estimated labour is 3.5 hours."},
      {role:"agent",tag:"agentforce",text:"Got it — 3.5 labour hours noted. Here's your claim summary:\n\n✓ Vehicle: Electra E-Pulse 300, 2022\n✓ Warranty: Active\n✓ Fault: Battery range -40% at 28,450 km\n✓ Part: EV-HVB-3201\n✓ Labour: 3.5 hrs\n\nShall I submit this for approval?"}
    ],
    fields:[
      {label:"VIN",val:"WBA3A5G59DNP26858",state:"prefilled"},
      {label:"Vehicle model",val:"Electra E-Pulse 300",state:"prefilled"},
      {label:"Model year",val:"2022",state:"prefilled"},
      {label:"Warranty status",val:"Active — expires Dec 2025",state:"prefilled"},
      {label:"Dealer account",val:"Sunrise Motors, Mumbai",state:"prefilled"},
      {label:"Mileage at claim",val:"28,450 km",state:"captured"},
      {label:"Fault description",val:"Battery range degradation ~40%",state:"captured"},
      {label:"Part number",val:"EV-HVB-3201 (confirmed)",state:"captured"},
      {label:"Labour hours",val:"3.5 hrs",state:"captured"},
    ],
    insight:"All 9 fields populated. 5 auto-filled from Automotive Cloud, 4 captured conversationally. The dealer never filled a form — total interaction under 3 minutes."
  },
  {
    title:"Step 5 of 5 — Claim created in Automotive Cloud",
    progress:100,
    conversation:[
      {role:"dealer",text:"Yes, go ahead and submit."},
      {role:"agent",tag:"auto-lookup",text:"Your warranty claim has been submitted.\n\nClaim ID: WC-2024-084471\nStatus: Pending approval\n\nYou'll receive a WhatsApp notification the moment the OEM approver reviews it. Estimated response: under 2 hours."}
    ],
    fields:[
      {label:"VIN",val:"WBA3A5G59DNP26858",state:"prefilled"},
      {label:"Vehicle model",val:"Electra E-Pulse 300",state:"prefilled"},
      {label:"Model year",val:"2022",state:"prefilled"},
      {label:"Warranty status",val:"Active — expires Dec 2025",state:"prefilled"},
      {label:"Dealer account",val:"Sunrise Motors, Mumbai",state:"prefilled"},
      {label:"Mileage at claim",val:"28,450 km",state:"captured"},
      {label:"Fault description",val:"Battery range degradation ~40%",state:"captured"},
      {label:"Part number",val:"EV-HVB-3201",state:"captured"},
      {label:"Labour hours",val:"3.5 hrs",state:"captured"},
    ],
    claimId:"WC-2024-084471",
    insight:"Agentforce triggers a Salesforce Flow that creates the structured Warranty Claim record in Automotive Cloud and fires a Platform Event — instantly notifying the OEM approver via Slack."
  }
];

let cur = 0;

function badge(state){
  if(state==="prefilled") return ' <span class="badge badge-auto">Auto-filled</span>';
  if(state==="captured") return ' <span class="badge badge-conv">Conversational</span>';
  return '';
}

function tagHtml(tag){
  if(tag==="auto-lookup") return '<span class="msg-tag tag-auto">Automotive Cloud lookup</span><br>';
  if(tag==="agentforce") return '<span class="msg-tag tag-agent">Agentforce</span><br>';
  return '';
}

function renderMsg(m){
  const isDealer = m.role==="dealer";
  const txt = (m.text||"").replace(/\n/g,"<br>");
  return `<div class="msg-wrap${isDealer?" dealer":""}">
    <div class="msg ${isDealer?"msg-dealer":"msg-agent"}">${!isDealer&&m.tag?tagHtml(m.tag):""}${txt}</div>
    <div class="msg-time">${isDealer?"You · dealer":"Electra Agent"} · just now</div>
  </div>`;
}

function render(){
  const s = steps[cur];
  const preFilled = s.fields.filter(f=>f.state==="prefilled").length;
  const conv = s.fields.filter(f=>f.state==="captured").length;
  const pending = s.fields.filter(f=>f.state==="pending").length;
  const isLast = cur===steps.length-1;

  const fieldRows = s.fields.map(f=>`
    <div class="sf-row">
      <span class="sf-label">${f.label}</span>
      <div style="display:flex;align-items:center;gap:5px;">
        <span class="sf-val ${f.state}">${f.val}</span>${badge(f.state)}
      </div>
    </div>`).join("");

  const claimBanner = s.claimId ? `<div class="claim-banner"><div class="claim-dot"></div><span class="claim-txt">Claim ${s.claimId} created in Automotive Cloud</span></div>` : "";

  document.getElementById("root").innerHTML = `
    <div class="step-header">
      <span class="step-title">${s.title}</span>
      <span class="step-pct">${s.progress}% complete</span>
    </div>
    <div style="height:4px;background:#eee;border-radius:2px;margin-bottom:14px;">
      <div style="height:4px;border-radius:2px;background:#25d366;width:${s.progress}%;transition:width 0.3s;"></div>
    </div>
    <div class="layout">
      <div>
        <p class="panel-label">WhatsApp — dealer conversation</p>
        <div class="phone-shell">
          <div class="wa-header">
            <div class="wa-avatar">EA</div>
            <div><p class="wa-name">Electra Warranty Agent</p><p class="wa-status">online</p></div>
          </div>
          <div class="wa-body">${s.conversation.map(renderMsg).join("")}</div>
        </div>
      </div>
      <div class="sf-panel">
        <p class="panel-label">Automotive Cloud — warranty claim record</p>
        <div class="sf-card">
          <div class="sf-card-header">
            <span>Warranty claim fields</span>
            <span style="font-size:11px;color:#888;">${preFilled} auto · ${conv} conv · ${pending} pending</span>
          </div>
          <div class="sf-fields">${fieldRows}</div>
        </div>
        ${claimBanner}
        <div class="insight-chip">
          <div class="insight-lbl">What's happening</div>
          ${s.insight}
        </div>
      </div>
    </div>
    <div class="step-nav">
      <button class="step-btn" onclick="go(-1)" ${cur===0?"disabled":""}>Previous</button>
      ${!isLast
        ? `<button class="step-btn primary" onclick="go(1)">Next step &rarr;</button>`
        : `<button class="step-btn primary" style="background:#0070d2;border-color:#0070d2;">Claim submitted — WC-2024-084471</button>`
      }
    </div>`;
}

function go(d){ cur=Math.max(0,Math.min(steps.length-1,cur+d)); render(); }
render();
</script>
</body>
</html>
