<template>
    <template lwc:if={hasContext}>
        <div class="dashboard-shell">
            <section class="greeting">
                <div class="greet-eyebrow">{greetingEyebrow}</div>
                <h1 class="greet-title">
                    Good {greetingPeriod}, <span class="greet-accent">{heroDealershipName}</span>.<br />
                    Your claims operations are moving beautifully.
                </h1>
                <p class="greet-sub">{greetingSummary}</p>
                <div class="greet-actions">
                    <button class="btn-secondary" aria-label="Export claim report" onclick={handleExportReport}>
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                        </svg>
                        Export Report
                    </button>
                </div>
            </section>

            <template lwc:if={isLoading}>
                <section class="state-panel state-panel--loading" aria-busy="true" aria-live="polite">
                    <lightning-spinner alternative-text="Loading claims dashboard" size="large"></lightning-spinner>
                    <p class="state-panel-loading-text">Loading your claims…</p>
                </section>
            </template>
            <template lwc:elseif={loadError}>
                <section class="error-banner">{loadError}</section>
            </template>
            <template lwc:else>
            <section class="vin-insight" aria-labelledby="vin-insight-title">
                <div class="vin-insight-inner">
                    <div class="vin-insight-head">
                        <span class="vin-insight-kicker">Last <span class="vin-insight-kicker-num">{frequentVinWindowDays}</span> days</span>
                        <h2 id="vin-insight-title" class="vin-insight-title">Frequently claimed VINs</h2>
                        <p class="vin-insight-lead">Same-VIN repeats often mean tighter review — snapshot below.</p>
                    </div>
                    <p class="vin-insight-expectation">{frequentVinExpectation}</p>
                    <template lwc:if={hasTopFrequentVinsRows}>
                        <ul class="vin-insight-list" aria-label="Top VINs by claim count">
                            <template for:each={topFrequentVinsDisplay} for:item="row">
                                <li key={row.key} class="vin-insight-row">
                                    <div class="vin-insight-row-top">
                                        <span class="vin-insight-vin" title={row.vinInsightTitle}>{row.vin}</span>
                                        <span class="vin-insight-count" title={row.claimSummaryTitle}>
                                            <span class="vin-insight-count-value">{row.claimCount}</span>
                                            <span class="vin-insight-count-unit">claim{row.claimCountPlural}</span>
                                        </span>
                                    </div>
                                    <template lwc:if={row.hasIssueBreakdown}>
                                        <div class="vin-insight-issues" role="list" aria-label="Issues for this VIN">
                                            <template for:each={row.issueBreakdownDisplay} for:item="issueRow">
                                                <div key={issueRow.key} class="vin-insight-issue-line" role="listitem">
                                                    <span class="vin-insight-issue-line-text">{issueRow.issueLabel}</span>
                                                    <span class="vin-insight-issue-line-count" title={issueRow.issueCountTitle}>×{issueRow.claimCount}</span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <template lwc:else>
                                        <p class="vin-insight-issue vin-insight-issue--muted">No issue descriptions on claims for this VIN in the window.</p>
                                    </template>
                                </li>
                            </template>
                        </ul>
                    </template>
                </div>
            </section>
            <section class="metrics">
                <article class="metric-card metric-total">
                    <div class="metric-icon-wrap">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                        </svg>
                    </div>
                    <div class="metric-body">
                        <span class="metric-label">Total Claims</span>
                        <span class="metric-value">{totalClaims}</span>
                        <span class="metric-trend">{totalClaimsTrend}</span>
                    </div>
                </article>

                <article class="metric-card metric-review">
                    <div class="metric-icon-wrap">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 6v6l4 2"/>
                        </svg>
                    </div>
                    <div class="metric-body">
                        <span class="metric-label">Under Review</span>
                        <span class="metric-value">{underReviewCount}</span>
                        <span class="metric-trend">{underReviewTrend}</span>
                    </div>
                </article>

                <article class="metric-card metric-approved">
                    <div class="metric-icon-wrap">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4L12 14.01l-3-3"/>
                        </svg>
                    </div>
                    <div class="metric-body">
                        <span class="metric-label">Approved</span>
                        <span class="metric-value">{approvedCount}</span>
                        <span class="metric-trend">{approvalRate}% approval rate</span>
                    </div>
                </article>

                <article class="metric-card metric-recovered">
                    <div class="metric-icon-wrap">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="1" x2="12" y2="23"/>
                            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                        </svg>
                    </div>
                    <div class="metric-body">
                        <span class="metric-label">Value Recovered</span>
                        <span class="metric-value">{formattedValueRecovered}</span>
                        <span class="metric-trend">Approved claims YTD</span>
                    </div>
                </article>
            </section>

            <template lwc:if={showTierProgress}>
                <section class="tier-banner" aria-label="Dealer partner tier and goals">
                    <div class="tier-banner-inner">
                        <div class="tier-banner-col tier-banner-intro">
                            <div class="tier-banner-brand-row">
                                <div class="tier-banner-brand">
                                    <span class="tier-banner-sparkle" aria-hidden="true">✦</span>
                                    <div>
                                        <p class="tier-banner-kicker">Claims intelligence</p>
                                        <p class="tier-banner-brand-title">Dealer program</p>
                                    </div>
                                </div>
                                <span class={tierBannerBadgeClass}>{currentTierDef.label}</span>
                            </div>
                            <p class="tier-banner-brand-sub">Volume and approval quality drive your tier — same data as your KPI cards.</p>
                        </div>

                        <div class="tier-banner-col tier-banner-current">
                            <h3 class="tier-banner-heading">Current tier &amp; details</h3>
                            <ul class="tier-banner-list">
                                <template for:each={tierCurrentDetailRows} for:item="row">
                                    <li key={row.id}>
                                        <span class="tier-banner-li-label">{row.label}:</span>
                                        <span class="tier-banner-li-value">{row.value}</span>
                                    </li>
                                </template>
                            </ul>
                            <div
                                class="tier-banner-meter"
                                style={tierMeterStyle}
                                role="progressbar"
                                aria-valuemin="0"
                                aria-valuemax="100"
                                aria-valuenow={tierProgressPercent}
                                aria-label="Progress toward next partner tier"
                            >
                                <div class="tier-banner-meter-fill"></div>
                            </div>
                            <p class="tier-banner-meter-caption">Progress toward {nextTierLabel}</p>
                        </div>

                        <div class="tier-banner-col tier-banner-next">
                            <h3 class="tier-banner-heading">Next best actions</h3>
                            <p class="tier-banner-next-lead">{tierAdvanceHeadline}</p>
                            <ul class="tier-banner-list tier-banner-list--actions">
                                <template for:each={tierNextActionRows} for:item="row">
                                    <li key={row.id}>{row.text}</li>
                                </template>
                            </ul>
                        </div>

                        <div class="tier-banner-col tier-banner-benefits">
                            <h3 class="tier-banner-heading">{tierBenefitsHeading}</h3>
                            <ul class="tier-banner-list tier-banner-list--benefits">
                                <template for:each={tierNextBenefitRows} for:item="row">
                                    <li key={row.id}>{row.text}</li>
                                </template>
                            </ul>
                        </div>
                    </div>
                </section>
            </template>

            <section class="toolbar">
                <div class="toolbar-left">
                    <div class="search-wrap">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="M21 21l-4.35-4.35"/>
                        </svg>
                        <input
                            type="text"
                            placeholder="Search by VIN, claim ID, vehicle, or customer..."
                            value={searchTerm}
                            onkeyup={handleSearch}
                            class="search-input"
                            aria-label="Search claims"
                        />
                    </div>
                </div>
                <div class="toolbar-right">
                    <div class="chips">
                        <template for:each={statusFilterOptions} for:item="opt">
                            <button
                                key={opt.value}
                                class={opt.class}
                                data-value={opt.value}
                                onclick={handleStatusFilter}
                            >
                                {opt.label}
                            </button>
                        </template>
                    </div>
                    <template lwc:if={showViewModeToggle}>
                        <div class="view-toggle">
                            <button class={cardViewClass} data-mode="card" onclick={handleViewModeToggle} title="Card view" aria-label="Card view">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="7" height="7"/>
                                    <rect x="14" y="3" width="7" height="7"/>
                                    <rect x="3" y="14" width="7" height="7"/>
                                    <rect x="14" y="14" width="7" height="7"/>
                                </svg>
                            </button>
                            <button class={tableViewClass} data-mode="table" onclick={handleViewModeToggle} title="Table view" aria-label="Table view">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="4" width="18" height="16" rx="2"/>
                                    <line x1="3" y1="9" x2="21" y2="9"/>
                                    <line x1="9" y1="9" x2="9" y2="20"/>
                                    <line x1="15" y1="9" x2="15" y2="20"/>
                                </svg>
                            </button>
                        </div>
                    </template>
                </div>
            </section>

            <template lwc:if={showMobileClaimsHint}>
                <p class="claims-hint-mobile">Tap a claim in the list to open full details.</p>
            </template>

            <section class="main-grid">
                <template lwc:if={isCardView}>
                    <div class="claims-grid">
                        <template lwc:if={hasFilteredClaims}>
                            <template for:each={filteredClaims} for:item="claim">
                                <article
                                    key={claim.id}
                                    class={claim.cardClass}
                                    data-id={claim.id}
                                    onclick={handleClaimSelect}
                                >
                                    <div class="claim-image-wrap">
                                        <img src={claim.vehicleImage} alt="" class="claim-image" loading="lazy"/>
                                        <div class="claim-image-overlay"></div>
                                        <span class={claim.statusBadgeClass}>{claim.status}</span>
                                        <span class={claim.priorityClass}>{claim.priority}</span>
                                    </div>

                                    <div class="claim-body">
                                        <div class="claim-header">
                                            <span class="claim-id">{claim.claimNumber}</span>
                                            <span class="claim-channel">via {claim.WC_Approval_Channel__c}</span>
                                        </div>

                                        <template lwc:if={claim.vehicle}>
                                            <h3 class="claim-vehicle">{claim.vehicle}</h3>
                                        </template>
                                        <p class="claim-vin">VIN · {claim.vin}</p>

                                        <div class="claim-issue-wrap">
                                            <span class="claim-issue-label">Reported Issue</span>
                                            <p class="claim-issue">{claim.issue}</p>
                                        </div>

                                        <div class="claim-footer">
                                            <div class="claim-meta">
                                                <span class="meta-item">
                                                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
                                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                                        <circle cx="12" cy="7" r="4"/>
                                                    </svg>
                                                    {claim.customer}
                                                </span>
                                            </div>
                                            <span class="claim-value">{claim.formattedValue}</span>
                                        </div>
                                    </div>
                                </article>
                            </template>
                        </template>
                        <template lwc:else>
                            <div class="claims-empty">{emptyListMessage}</div>
                        </template>
                    </div>
                </template>
                <template lwc:else>
                    <div class="claims-table-wrap">
                        <template lwc:if={hasFilteredClaims}>
                            <lightning-datatable
                                key-field="id"
                                data={tableRows}
                                columns={tableColumns}
                                max-row-selection="1"
                                selected-rows={selectedRowsForTable}
                                onrowselection={handleTableRowSelection}
                            ></lightning-datatable>
                        </template>
                        <template lwc:else>
                            <div class="claims-empty">{emptyListMessage}</div>
                        </template>
                    </div>
                </template>

                <aside class="detail-panel">
                    <template lwc:if={hasSelectedClaim}>
                        <div class="detail-header">
                            <button class="detail-close" onclick={handleCloseDetail} title="Close" aria-label="Close details panel">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="18" y1="6" x2="6" y2="18"/>
                                    <line x1="6" y1="6" x2="18" y2="18"/>
                                </svg>
                            </button>
                            <span class="detail-id">{selectedClaim.claimNumber}</span>
                            <span class={selectedClaim.statusBadgeClass}>{selectedClaim.status}</span>
                        </div>

                        <div class="detail-hero">
                            <img src={selectedClaim.vehicleImage} alt="" class="detail-image"/>
                        </div>

                        <div class="detail-body">
                            <template lwc:if={selectedClaim.vehicle}>
                                <h2 class="detail-vehicle">{selectedClaim.vehicle}</h2>
                            </template>
                            <p class="detail-vin">{selectedClaim.vin}</p>

                            <div class="detail-grid">
                                <div class="detail-cell">
                                    <span class="cell-label">Customer</span>
                                    <span class="cell-value">{selectedClaim.customer}</span>
                                </div>
                                <div class="detail-cell">
                                    <span class="cell-label">Mileage</span>
                                    <span class="cell-value">{selectedClaim.mileage} mi</span>
                                </div>
                                <div class="detail-cell">
                                    <span class="cell-label">Channel</span>
                                    <span class="cell-value">{selectedClaim.WC_Approval_Channel__c}</span>
                                </div>
                                <div class="detail-cell">
                                    <span class="cell-label">Est. Value</span>
                                    <span class="cell-value cell-value-strong">{selectedClaim.formattedValue}</span>
                                </div>
                            </div>

                            <div class="detail-issue">
                                <span class="cell-label">Issue Category</span>
                                <p class="issue-category">{selectedClaim.issueCategory}</p>
                                <p class="issue-text">{selectedClaim.issue}</p>
                            </div>

                            <div class="timeline">
                                <h4 class="timeline-title">Warranty Claim Timeline</h4>
                                <template for:each={selectedClaim.timeline} for:item="step">
                                    <div key={step.id} class={step.class}>
                                        <span class="step-icon">{step.icon}</span>
                                        <div class="step-body">
                                            <span class="step-label">{step.label}</span>
                                            <span class="step-date">{step.date}</span>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <div class="detail-insights" aria-label="AI-generated claim insights">
                                <div class="detail-insights-bg" aria-hidden="true"></div>
                                <div class="detail-insights-head">
                                    <div class="detail-insights-ai-mark" aria-hidden="true">
                                        <svg class="detail-insights-sparkle" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                                            <path d="M12 2l1.4 5.2L19 9l-5.6 1.8L12 16l-1.4-5.2L5 9l5.6-1.8L12 2z"/>
                                        </svg>
                                        <svg class="detail-insights-brain" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.4">
                                            <path d="M12 5a3 3 0 0 0-3 3v1a3 3 0 0 0-2 2.8V14a4 4 0 0 0 4 4h2a4 4 0 0 0 4-4v-2.2a3 3 0 0 0-2-2.8V8a3 3 0 0 0-3-3z"/>
                                            <path d="M9 12h6M12 9v6" stroke-linecap="round" opacity="0.6"/>
                                        </svg>
                                    </div>
                                    <div class="detail-insights-head-text">
                                        <span class="detail-insights-eyebrow">AI insights</span>
                                        <h4 class="detail-insights-title">Pattern &amp; manufacturer signal</h4>
                                    </div>
                                </div>

                                <!-- <div class="detail-insights-visual" aria-hidden="true">
                                    <span class="detail-insights-chip detail-insights-chip--pulse">Neural match</span>
                                    <span class="detail-insights-chip">OEM graph</span>
                                    <span class="detail-insights-chip">HV safety</span>
                                </div> -->

                                <template lwc:if={selectedClaim.insights.hasPeerReports}>
                                    <p class="detail-insights-lead">
                                        The <strong>same issue category</strong> was reported
                                        <strong class="detail-insights-highlight"> {selectedClaim.insights.similarPhrase} </strong>
                                        in the past <strong>90 days</strong> on this account, with cases involving &nbsp;
                                        <strong>{selectedClaim.insights.componentFocus}</strong>. Electra recommends a &nbsp;
                                        <strong>manufacturer-level</strong> review: supplier defects, silent campaigns, and OEM bulletins tied to this component family.
                                    </p>
                                </template>
                                <template lwc:else>
                                    <p class="detail-insights-lead">
                                        <strong>No other claims</strong> with this issue category appeared in the last <strong>90 days</strong> for this dealer. For
                                        <strong>{selectedClaim.insights.componentFocus}</strong> and related HV systems, still run a
                                        <strong>manufacturer-side</strong> sweep—field reports, NHTSA patterns, and known OEM quality holds can surface company-side defects even with low local volume.
                                    </p>
                                </template>

                                <ul class="detail-insights-list">
                                    <li>Compare against latest <strong>TSP / TSB</strong> and regional recall feeds for this VIN prefix.</li>
                                    <li>Trace <strong>battery module lot codes</strong> and inverter supplier batches when HV symptoms cluster.</li>
                                    <li>Escalate to <strong>warranty engineering</strong> if repeat codes align with a documented OEM correction.</li>
                                </ul>
                            </div>

                        </div>
                    </template>

                    <template lwc:else>
                        <div class="detail-empty">
                            <div class="empty-icon">
                                <svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                    <polyline points="14 2 14 8 20 8"/>
                                    <line x1="16" y1="13" x2="8" y2="13"/>
                                    <line x1="16" y1="17" x2="8" y2="17"/>
                                </svg>
                            </div>
                            <h3 class="empty-title">Select a claim</h3>
                            <p class="empty-text">Choose any claim from the list to see vehicle details, customer info, and the full timeline of activity.</p>
                        </div>
                    </template>
                </aside>
            </section>

            <footer class="portal-footer-contact">
                <div class="portal-footer-support">
                    <div class="portal-footer-help-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                            <circle cx="12" cy="12" r="9"></circle>
                            <path d="M9.6 9.5a2.6 2.6 0 1 1 4.6 1.7c-.7.8-1.8 1.4-1.8 2.8"></path>
                            <circle cx="12" cy="17" r="1"></circle>
                        </svg>
                    </div>
                    <div class="portal-footer-copy">
                        <div class="portal-footer-title">Need a hand?</div>
                        <div class="portal-footer-sub">Help with claim escalations, approvals, or dealer support</div>
                    </div>
                </div>
                <div class="portal-footer-actions">
                    <a class="portal-footer-link" href="tel:+14152269946">
                        <span class="portal-footer-link-label">Call us</span>
                        <span class="portal-footer-link-value">+1 (415) 226-9946</span>
                    </a>
                    <a class="portal-footer-link" href="https://wa.me/15556339598" target="_blank" rel="noopener noreferrer">
                        <span class="portal-footer-link-label">WhatsApp</span>
                        <span class="portal-footer-link-value">+1 (555) 633-9598</span>
                    </a>
                </div>
            </footer>
            </template>
        </div>
    </template>
    <template lwc:else>
        <div class="state-panel state-panel--plain">
            Connect this component to a dealer account by setting `accountId` in Experience Builder or opening as a logged-in dealer user.
        </div>
    </template>
</template>
