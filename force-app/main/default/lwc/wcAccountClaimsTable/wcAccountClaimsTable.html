<template>
    <template lwc:if={embedded}>
        <template lwc:if={hasAccountContext}>
            <template lwc:if={isLoading}>
                <div class="state-wrap">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </div>
            </template>
            <template lwc:elseif={loadError}>
                <div class="state-wrap slds-text-color_error">{loadError}</div>
            </template>
            <template lwc:else>
                <div class="portal-list-head">
                    <span class="portal-list-title">Claims list</span>
                    <span class="portal-list-meta">{listHeaderCount}</span>
                </div>
                <div class="portal-toolbar">
                    <lightning-input
                        class="portal-search"
                        type="search"
                        variant="label-hidden"
                        placeholder="Search VIN, Claim ID, Vehicle…"
                        value={searchKey}
                        onchange={handleSearch}
                    ></lightning-input>
                    <lightning-combobox
                        class="portal-filter"
                        label="Status"
                        variant="label-hidden"
                        value={statusFilter}
                        placeholder="Status"
                        options={statusOptions}
                        onchange={handleStatusFilter}
                    ></lightning-combobox>
                    <lightning-combobox
                        class="portal-filter"
                        label="Channel"
                        variant="label-hidden"
                        value={channelFilter}
                        placeholder="Channel"
                        options={channelOptions}
                        onchange={handleChannelFilter}
                    ></lightning-combobox>
                </div>
                <div class="table-wrap">
                    <lightning-datatable
                        key-field="id"
                        data={tableData}
                        columns={columns}
                        hide-checkbox-column={datatableHideCheckbox}
                        max-row-selection={datatableMaxRowSelection}
                        selected-rows={selectedRowsForGrid}
                        show-row-number-column={datatableShowRowNumber}
                        onrowselection={handleRowSelection}
                    ></lightning-datatable>
                </div>
                <div class="portal-footer">
                    <span class="portal-footer-left">Showing {showingFrom}–{showingTo} of {totalFiltered}</span>
                    <span class="portal-footer-right">
                        <span class="portal-page-label">{pageSummary}</span>
                        <lightning-button
                            class="portal-page-btn"
                            variant="neutral"
                            label="Previous"
                            disabled={disablePrev}
                            onclick={handlePrev}
                        ></lightning-button>
                        <lightning-button
                            class="portal-page-btn"
                            variant="neutral"
                            label="Next"
                            disabled={disableNext}
                            onclick={handleNext}
                        ></lightning-button>
                    </span>
                </div>
            </template>
        </template>
        <template lwc:else>
            <div class="state-wrap slds-text-color_weak">Set Account Id or use on an Account record page.</div>
        </template>
    </template>
    <template lwc:else>
        <lightning-card title="Claims" icon-name="standard:case">
            <template lwc:if={hasAccountContext}>
                <template lwc:if={isLoading}>
                    <div class="state-wrap">
                        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                    </div>
                </template>
                <template lwc:elseif={loadError}>
                    <div class="state-wrap slds-text-color_error">{loadError}</div>
                </template>
                <template lwc:else>
                    <div class="table-wrap">
                        <lightning-datatable
                            key-field="id"
                            data={tableData}
                            columns={columns}
                            hide-checkbox-column
                            max-row-selection="0"
                            show-row-number-column
                        ></lightning-datatable>
                    </div>
                </template>
            </template>
            <template lwc:else>
                <div class="state-wrap slds-text-color_weak">
                    Set Account Id (record page) or the Account Id property (App Builder).
                </div>
            </template>
        </lightning-card>
    </template>
</template>
