  <rect x="120" y="94" width="620" height="230" rx="18" fill="#ffffff" stroke="#b5d7f6" stroke-width="4"/>
  <rect x="156" y="126" width="548" height="128" rx="10" fill="url(#glass)"/>
  <rect x="176" y="138" width="158" height="102" rx="8" fill="#ebf6ff"/>
