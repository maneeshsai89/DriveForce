
<style>
*{box-sizing:border-box;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
.nav-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:1rem;}
.nav-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px;cursor:pointer;transition:border-color 0.15s;}
.nav-card:hover,.nav-card.active{border-color:var(--color-border-primary);background:var(--color-background-secondary);}
.nav-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;margin-bottom:7px;}
.nav-title{font-size:12px;font-weight:500;color:var(--color-text-primary);margin:0 0 2px;}
.nav-sub{font-size:11px;color:var(--color-text-secondary);margin:0;}
.detail-panel{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:16px;margin-bottom:1rem;}
.dp-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:10px;border-bottom:0.5px solid var(--color-border-tertiary);}
.dp-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;flex-shrink:0;}
.dp-title{font-size:15px;font-weight:500;color:var(--color-text-primary);margin:0 0 2px;}
.dp-sub{font-size:12px;color:var(--color-text-secondary);margin:0;}
.section-label{font-size:11px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:0.04em;margin:0 0 8px;}
.item-row{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary);}
.item-row:last-child{border-bottom:none;}
.item-badge{font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;flex-shrink:0;margin-top:1px;}
.item-body{flex:1;min-width:0;}
.item-title{font-size:12px;font-weight:500;color:var(--color-text-primary);margin:0 0 2px;}
.item-desc{font-size:11px;color:var(--color-text-secondary);line-height:1.4;margin:0;}
.code-pill{font-family:var(--font-mono);font-size:10px;background:var(--color-background-secondary);padding:1px 6px;border-radius:3px;color:var(--color-text-secondary);}
.flow-step{display:flex;align-items:flex-start;gap:8px;padding:6px 0;}
.flow-num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;flex-shrink:0;background:var(--color-background-info);color:var(--color-text-info);}
.flow-text{font-size:11px;color:var(--color-text-secondary);line-height:1.4;margin:0;flex:1;}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;}
.checklist{display:flex;flex-direction:column;gap:4px;}
.check-item{display:flex;align-items:flex-start;gap:6px;font-size:11px;color:var(--color-text-secondary);line-height:1.4;}
.check-box{width:14px;height:14px;border-radius:3px;border:0.5px solid var(--color-border-secondary);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;}
.check-box.done{background:var(--color-background-success);border-color:var(--color-border-success);}
.check-tick{font-size:9px;color:var(--color-text-success);}
.explore-btn{width:100%;font-size:12px;padding:7px;cursor:pointer;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);margin-top:8px;}
.explore-btn:hover{background:var(--color-background-secondary);}
</style>

<h2 class="sr-only">Technical implementation guide navigator for Electra Cars Warranty Claim Agent</h2>

<div id="root"></div>

<script>
const sections = [
  {
    id:"datamodel", title:"Data model", sub:"Automotive Cloud objects", icon:"AC", iconBg:"#E6F1FB", iconColor:"#0C447C",
    content(){
      return `
      <div class="section-label">Core objects</div>
      ${[
        ["WarrantyClaim__c","Primary record","14 custom fields — VIN, fault, part, AI summary, risk score, approval details"],
        ["Vehicle__c","Automotive Cloud std","VIN, model, year, mileage, dealer assignment"],
        ["Warranty__c","Automotive Cloud std","Coverage tier, expiry date, mileage cap"],
        ["Part__c","Custom catalogue","Part number, fault keywords, model compatibility, coverage tier"],
        ["ServiceBulletin__c","Custom","Known issues linked to models and parts for AI matching"],
      ].map(([api,type,desc])=>`
        <div class="item-row">
          <span class="item-badge" style="background:#E6F1FB;color:#0C447C;">${type}</span>
          <div class="item-body">
            <p class="item-title"><span class="code-pill">${api}</span></p>
            <p class="item-desc">${desc}</p>
          </div>
        </div>`).join("")}
      <div class="section-label" style="margin-top:14px;">Key validation rules</div>
      ${[
        ["Warranty active check","Blocks claim creation if Warranty__r.Status__c ≠ Active"],
        ["Mileage cap check","Blocks if MileageAtClaim__c exceeds Warranty__r.MileageCap__c"],
        ["Part catalogue check","Blocks if PartNumber__c has no matching Part__c record"],
      ].map(([t,d])=>`<div class="item-row"><div class="item-body"><p class="item-title">${t}</p><p class="item-desc">${d}</p></div></div>`).join("")}
      `;
    }
  },
  {
    id:"agents", title:"Agentforce", sub:"Topics & actions", icon:"AF", iconBg:"#EEEDFE", iconColor:"#3C3489",
    content(){
      return `
      <div class="two-col">
        <div>
          <div class="section-label">Intake agent — 2 topics</div>
          ${[
            ["Submit Warranty Claim","Conversational intake via WhatsApp / web. Calls 3 actions. Max 12 turns."],
            ["Check Claim Status","Dealer queries existing claim by ID or VIN."],
          ].map(([t,d])=>`<div class="item-row"><span class="item-badge" style="background:#E1F5EE;color:#085041;">Topic</span><div class="item-body"><p class="item-title">${t}</p><p class="item-desc">${d}</p></div></div>`).join("")}
          <div class="section-label" style="margin-top:12px;">Intake agent — 4 actions</div>
          ${[
            ["LookupVehicleByVIN","Apex invocable — queries Vehicle__c + Warranty__c. Returns 6 fields."],
            ["SuggestPartNumber","Apex + Einstein Data Library — semantic fault→part matching, 94% confidence."],
            ["CreateWarrantyClaim","Autolaunched Flow — creates record, fires Platform Event."],
            ["GetClaimStatus","Apex — returns status and approval details for dealer."],
          ].map(([t,d])=>`<div class="item-row"><span class="item-badge" style="background:#EEEDFE;color:#3C3489;">Action</span><div class="item-body"><p class="item-title"><span class="code-pill">${t}</span></p><p class="item-desc">${d}</p></div></div>`).join("")}
        </div>
        <div>
          <div class="section-label">Approver agent — 1 topic</div>
          ${[
            ["Claim Review Assistance","Slack-based Q&A for OEM approvers. Reasons across Data Cloud, Automotive Cloud, and policy docs."],
          ].map(([t,d])=>`<div class="item-row"><span class="item-badge" style="background:#E1F5EE;color:#085041;">Topic</span><div class="item-body"><p class="item-title">${t}</p><p class="item-desc">${d}</p></div></div>`).join("")}
          <div class="section-label" style="margin-top:12px;">Approver agent — 4 actions</div>
          ${[
            ["GenerateClaimSummary","Prompt Template + Apex — Atlas Reasoning Engine produces 60-word brief + recommendation."],
            ["CalculateRiskScore","Apex — 7-factor scoring model, returns 0–100 integer + risk factor list."],
            ["QueryDealerClaimHistory","Apex + Data Cloud API — dealer frequency, anomaly flag, approval rate."],
            ["SlackApproveRejectAction","Flow — updates record, stamps approver, triggers WhatsApp notification."],
          ].map(([t,d])=>`<div class="item-row"><span class="item-badge" style="background:#EEEDFE;color:#3C3489;">Action</span><div class="item-body"><p class="item-title"><span class="code-pill">${t}</span></p><p class="item-desc">${d}</p></div></div>`).join("")}
        </div>
      </div>`;
    }
  },
  {
    id:"flows", title:"Flows", sub:"4 automation flows", icon:"FL", iconBg:"#FAEEDA", iconColor:"#633806",
    content(){
      const flows = [
        {name:"Create_Warranty_Claim_v2", trigger:"Agentforce action call", steps:[
          "Validate warranty active → else return error",
          "Create WarrantyClaim__c with 9 fields + ClaimSource = Agentforce",
          "Call CalculateRiskScore action → update AIRiskScore__c",
          "Publish Platform Event: Warranty_Claim_Submitted__e",
          "Return claimId and claimName to agent",
        ]},
        {name:"Notify_Approver_Slack_v1", trigger:"Platform Event: Warranty_Claim_Submitted__e", steps:[
          "Get full WarrantyClaim__c record",
          "Call GenerateClaimSummary (Agentforce prompt template)",
          "Call QueryDealerClaimHistory (Data Cloud)",
          "POST rich Block Kit card to #warranty-approvals via Slack API",
        ]},
        {name:"Update_Claim_Status_v1", trigger:"Slack approve / reject button click", steps:[
          "Update Status__c, ApprovedBy__c, ApprovedAt__c, ApprovalChannel__c",
          "Branch: Approved → subflow Send_WhatsApp_Approval",
          "Branch: Rejected → subflow Send_WhatsApp_Rejection",
          "Create activity log on WarrantyClaim__c",
          "Update Slack message to show decision banner via Slack API",
        ]},
        {name:"Send_WhatsApp_Approval (subflow)", trigger:"Called from Flow 3", steps:[
          "Get MessagingChannel (WhatsApp Business API)",
          "Create MessagingSession if none open",
          "Create outbound ContentMessage with approval template",
          "Stamp DealerNotifiedAt__c on claim record",
        ]},
      ];
      return flows.map(f=>`
        <div style="margin-bottom:14px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <span class="code-pill" style="font-size:11px;">${f.name}</span>
            <span style="font-size:11px;color:var(--color-text-secondary);">Trigger: ${f.trigger}</span>
          </div>
          ${f.steps.map((s,i)=>`<div class="flow-step"><div class="flow-num">${i+1}</div><p class="flow-text">${s}</p></div>`).join("")}
        </div>`).join(`<div style="height:0.5px;background:var(--color-border-tertiary);margin:4px 0 14px;"></div>`);
    }
  },
  {
    id:"channels", title:"Channels", sub:"WhatsApp · Slack · Data Cloud", icon:"CH", iconBg:"#E1F5EE", iconColor:"#085041",
    content(){
      return `
      <div class="two-col">
        <div>
          <div class="section-label">Digital Engagement — WhatsApp</div>
          ${[
            ["Inbound routing","All messages → Agentforce Intake Agent"],
            ["Fallback","Human queue after 3 failed extractions"],
            ["Template 1","CLAIM_SUBMITTED — confirms receipt with Claim ID"],
            ["Template 2","CLAIM_APPROVED — instructs dealer to proceed"],
            ["Template 3","CLAIM_REJECTED — includes reason + contact info"],
          ].map(([t,d])=>`<div class="item-row"><div class="item-body"><p class="item-title">${t}</p><p class="item-desc">${d}</p></div></div>`).join("")}

          <div class="section-label" style="margin-top:14px;">Platform Event</div>
          ${[
            ["Warranty_Claim_Submitted__e","Fires on claim create. Payload: claimId, dealerName, estimatedValue, riskScore, recommendation."],
          ].map(([t,d])=>`<div class="item-row"><div class="item-body"><p class="item-title"><span class="code-pill">${t}</span></p><p class="item-desc">${d}</p></div></div>`).join("")}
        </div>
        <div>
          <div class="section-label">Slack — Einstein for Slack</div>
          ${[
            ["Channel","#warranty-approvals — 3 members, Agentforce app installed"],
            ["Notification card","18 Block Kit blocks: claim fields, risk bar, 4 Data Cloud chips, AI summary, 4 action buttons"],
            ["Thread Q&A","Approver types natural language → Agentforce reasons and replies with cited sources"],
            ["Approve action","Fires Update_Claim_Status_v1 flow → record update + WhatsApp"],
          ].map(([t,d])=>`<div class="item-row"><div class="item-body"><p class="item-title">${t}</p><p class="item-desc">${d}</p></div></div>`).join("")}

          <div class="section-label" style="margin-top:14px;">Data Cloud</div>
          ${[
            ["Unified_Vehicle_Profile__dlm","Merges Automotive Cloud + telematics. Powers dealer frequency and anomaly signals."],
            ["Calculated Insights (3)","dealer_claim_freq_6mo, model_fault_pattern_match, vehicle_anomaly_flag"],
            ["Einstein Data Library","Electra_Claim_History_DC — semantic search across claim history for approver Q&A"],
          ].map(([t,d])=>`<div class="item-row"><div class="item-body"><p class="item-title">${t}</p><p class="item-desc">${d}</p></div></div>`).join("")}
        </div>
      </div>`;
    }
  },
  {
    id:"checklist", title:"Deploy checklist", sub:"Go-live readiness", icon:"CL", iconBg:"#EAF3DE", iconColor:"#27500A",
    content(){
      const groups = [
        {label:"Automotive Cloud", items:["Enable Automotive Cloud features in Setup","Deploy WarrantyClaim__c schema (14 fields)","Deploy 3 validation rules","Configure Service Console page layouts","Set up record types"]},
        {label:"Agentforce", items:["Enable Agentforce in Setup > Agents","Deploy Intake Agent — 2 topics, 4 actions","Deploy Approver Agent — 1 topic, 4 actions","Create GenerateClaimSummary Prompt Template","Configure 3 Einstein Data Libraries"]},
        {label:"Flows & Events", items:["Deploy all 4 Flows and activate","Create Warranty_Claim_Submitted__e schema","Subscribe Flow 2 to Platform Event","Test end-to-end event propagation"]},
        {label:"Channels", items:["Provision WhatsApp Business API number","Register 3 Meta message templates (2-week lead time)","Install Salesforce for Slack in workspace","Create #warranty-approvals channel","Configure Einstein for Slack agent"]},
        {label:"Data Cloud", items:["Enable Data Cloud in org","Create data streams from 4 AC objects","Configure Unified Vehicle Profile","Deploy 3 Calculated Insights","Connect to Agentforce Data Libraries"]},
        {label:"Testing", items:["Unit test all Apex classes","Flow happy-path and error-path tests","Agent test: VIN lookup + claim submission","Slack test: notification card + approve action","Load test: 50 concurrent WhatsApp submissions"]},
      ];
      return `<div class="two-col">${groups.map(g=>`
        <div>
          <div class="section-label">${g.label}</div>
          <div class="checklist">
            ${g.items.map(item=>`<div class="check-item"><div class="check-box"><span class="check-tick"></span></div><span>${item}</span></div>`).join("")}
          </div>
        </div>`).join("")}</div>`;
    }
  },
  {
    id:"limits", title:"Limits & risks", sub:"API limits & mitigations", icon:"LR", iconBg:"#FCEBEB", iconColor:"#A32D2D",
    content(){
      return [
        ["Agentforce turns / session","25 turns max","Intake agent capped at 12 turns. Escalate at turn 10 if claim incomplete."],
        ["Platform Event delivery","Near real-time","Monitor with Event Monitoring. Set up alert if delivery > 10 sec."],
        ["WhatsApp template approval","Meta review: ~2 weeks","Submit 3 templates 2 weeks before go-live. Use exact approved copy."],
        ["Data Cloud query latency","200–400 ms avg","Pre-compute dealer frequency via Calculated Insights. Query insight, not raw stream."],
        ["Apex CPU limit","10,000 ms","LookupVehicleByVIN uses indexed SOQL on VIN__c. No nested loops."],
        ["Slack Block Kit payload","50 blocks max","Notification card uses 18 blocks. Headroom available for future fields."],
        ["Concurrent WhatsApp sessions","Org messaging limit","Validate Digital Engagement capacity for 1,000 daily submissions. Request limit increase if needed."],
      ].map(([concern,limit,mitigation])=>`
        <div class="item-row">
          <span class="item-badge" style="background:#FCEBEB;color:#A32D2D;">Risk</span>
          <div class="item-body">
            <p class="item-title">${concern} <span class="code-pill">${limit}</span></p>
            <p class="item-desc">${mitigation}</p>
          </div>
        </div>`).join("");
    }
  },
];

let cur = 0;

function render(){
  const html = `
    <div class="nav-grid">
      ${sections.map((s,i)=>`
        <div class="nav-card${i===cur?" active":""}" onclick="setSection(${i})">
          <div class="nav-icon" style="background:${s.iconBg};color:${s.iconColor};">${s.icon}</div>
          <p class="nav-title">${s.title}</p>
          <p class="nav-sub">${s.sub}</p>
        </div>`).join("")}
    </div>
    <div class="detail-panel">
      <div class="dp-header">
        <div class="dp-icon" style="background:${sections[cur].iconBg};color:${sections[cur].iconColor};">${sections[cur].icon}</div>
        <div>
          <p class="dp-title">${sections[cur].title}</p>
          <p class="dp-sub">${sections[cur].sub}</p>
        </div>
      </div>
      ${sections[cur].content()}
    </div>
    <button class="explore-btn" onclick="sendPrompt('Generate a detailed technical implementation guide for the Electra Cars Warranty Claim Agent — Agentforce topics, actions, flows, and Automotive Cloud data model ↗')">Open full guide as document ↗</button>`;
  document.getElementById("root").innerHTML = html;
}

function setSection(i){ cur = i; render(); }
render();
</script>
