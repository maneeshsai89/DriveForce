<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Slack Approver Warranty Workflow</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;padding:1.5rem;color:#111;}
.slack-shell{background:#1a1d21;border-radius:16px;overflow:hidden;border:1px solid #2f3136;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.topbar{background:#19171d;padding:8px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #2f3136;}
.topbar-hash{font-size:15px;color:#adadad;}
.topbar-name{font-size:13px;font-weight:600;color:#d1d2d3;}
.topbar-badge{font-size:10px;padding:2px 8px;border-radius:99px;background:#4a154b;color:#fff;margin-left:6px;}
.topbar-right{margin-left:auto;font-size:11px;color:#72767d;}
.body{padding:16px;}
.ctx-bar{background:#222529;border-radius:6px;padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.ctx-dot{width:8px;height:8px;border-radius:50%;background:#4a9c5d;flex-shrink:0;}
.ctx-txt{font-size:11px;color:#8a8a8a;}
.ctx-val{font-size:11px;color:#d1d2d3;font-weight:600;}
.msg-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:2px;}
.avatar{width:34px;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0;}
.av-bot{background:#4a154b;}
.av-human{background:#1264a3;}
.sender-line{display:flex;align-items:baseline;gap:6px;margin-bottom:3px;}
.sender-name{font-size:13px;font-weight:600;color:#d1d2d3;}
.sender-app{font-size:10px;padding:1px 5px;border-radius:3px;background:#4a154b;color:#e0b8e8;font-weight:600;}
.sender-time{font-size:11px;color:#72767d;}
.msg-text{font-size:13px;color:#d1d2d3;line-height:1.5;margin:0 0 10px;}
.card{border-left:4px solid #0070d2;background:#222529;border-radius:0 8px 8px 0;padding:12px 14px;margin-bottom:6px;}
.card-title{font-size:14px;font-weight:600;color:#4a9ed6;margin:0 0 10px;}
.fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;margin-bottom:12px;}
.f-label{font-size:10px;color:#72767d;text-transform:uppercase;letter-spacing:0.04em;margin:0 0 1px;}
.f-val{font-size:12px;color:#d1d2d3;font-weight:600;margin:0;}
.f-val.green{color:#4a9c5d;}
.f-val.amber{color:#e8a838;}
.f-val.blue{color:#4a9ed6;}
.divider{height:1px;background:#333;margin:10px 0;}
.risk-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.risk-label{font-size:11px;color:#72767d;}
.risk-pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;}
.risk-low{background:#1a3a22;color:#4a9c5d;}
.risk-bar-wrap{flex:1;height:4px;background:#333;border-radius:2px;}
.risk-bar{height:4px;border-radius:2px;}
.ai-box{background:#1a1d21;border:1px solid #4a154b;border-radius:6px;padding:10px 12px;margin-bottom:12px;}
.ai-header{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.ai-icon{width:16px;height:16px;border-radius:3px;background:#4a154b;display:flex;align-items:center;justify-content:center;font-size:9px;color:#e0b8e8;font-weight:700;flex-shrink:0;}
.ai-label{font-size:10px;font-weight:600;color:#b39dcc;text-transform:uppercase;letter-spacing:0.04em;}
.ai-text{font-size:12px;color:#c8c9ca;line-height:1.55;margin:0 0 6px;}
.ai-rec{display:flex;align-items:center;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid #333;}
.ai-rec-label{font-size:11px;color:#72767d;}
.ai-rec-val{font-size:12px;font-weight:600;color:#4a9c5d;}
.action-row{display:flex;gap:8px;flex-wrap:wrap;}
.btn{font-size:12px;font-weight:600;padding:7px 16px;border-radius:4px;border:none;cursor:pointer;}
.btn-approve{background:#2e844a;color:#fff;}
.btn-reject{background:#3a3a3a;color:#d1d2d3;border:1px solid #555;}
.btn-ask{background:#1264a3;color:#fff;}
.qa-block{background:#1e2124;border-radius:6px;padding:10px 12px;border:1px solid #333;}
.qa-q{font-size:12px;color:#8a8a8a;margin:0 0 5px;}
.qa-a{font-size:12px;color:#c8c9ca;line-height:1.5;margin:0;}
.qa-cite{font-size:10px;color:#4a9ed6;margin-top:4px;}
.decision-block{background:#1a3a22;border-radius:6px;padding:10px 14px;border:1px solid #4a9c5d;}
.decision-title{font-size:13px;font-weight:600;color:#4a9c5d;margin:0 0 4px;}
.decision-text{font-size:12px;color:#c8c9ca;margin:0;}
.wa-preview{background:#1b2e1f;border-radius:6px;border-left:3px solid #25d366;padding:8px 12px;margin-top:4px;}
.wa-preview-label{font-size:10px;color:#4a9c5d;margin:0 0 4px;font-weight:600;}
.wa-preview-text{font-size:12px;color:#c8c9ca;margin:0;line-height:1.5;}
.divider-line{height:1px;background:#2f3136;margin:2px 0;}
.step-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.step-title{font-size:13px;font-weight:600;color:#111;}
.step-pct{font-size:11px;color:#888;}
.progress-wrap{height:4px;background:#eee;border-radius:2px;margin-bottom:14px;}
.progress-fill{height:4px;border-radius:2px;background:#4a9c5d;transition:width 0.3s;}
.insight-chip{background:#f8f8f8;border-radius:8px;padding:8px 12px;font-size:11px;color:#555;line-height:1.5;border:1px solid #eee;margin-top:12px;}
.insight-lbl{font-size:11px;font-weight:600;color:#333;margin-bottom:3px;}
.step-nav{display:flex;gap:8px;margin-top:12px;}
.step-btn{flex:1;font-size:12px;padding:8px;cursor:pointer;border-radius:8px;border:1px solid #ddd;background:#fff;color:#555;}
.step-btn:hover{background:#f5f5f5;}
.step-btn.primary{background:#075e54;color:#fff;border-color:#075e54;}
.step-btn:disabled{opacity:0.35;cursor:default;}
.notify-banner{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#1a2e1f 0%,#222529 100%);border:1px solid #2d5a3d;border-radius:8px;padding:10px 14px;margin-bottom:12px;}
.notify-icon{font-size:18px;line-height:1;}
.notify-body{flex:1;min-width:0;}
.notify-title{font-size:12px;font-weight:600;color:#4a9c5d;margin:0 0 2px;}
.notify-sub{font-size:11px;color:#8a8a8a;line-height:1.4;margin:0;}
.suggest-label{font-size:10px;font-weight:600;color:#72767d;text-transform:uppercase;letter-spacing:0.06em;margin:10px 0 6px;}
.suggest-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px;}
.suggest-pill{font-size:11px;padding:5px 10px;border-radius:99px;background:#2c3035;border:1px solid #444;color:#b8b9ba;cursor:pointer;transition:background .15s,border-color .15s;}
.suggest-pill:hover{background:#3d4248;border-color:#1264a3;color:#d1d2d3;}
.suggest-hint{font-size:10px;color:#5a5c5e;margin-top:6px;line-height:1.4;}
.composer-mock{margin-top:12px;border-top:1px solid #2f3136;padding-top:10px;}
.composer-inner{display:flex;align-items:flex-end;gap:8px;background:#1a1d21;border:1px solid #3f4147;border-radius:8px;padding:8px 10px;}
.composer-fake{flex:1;font-size:12px;color:#72767d;min-height:36px;line-height:1.4;padding:4px 0;}
.composer-send{width:32px;height:32px;border-radius:6px;background:#1264a3;border:none;color:#fff;cursor:default;opacity:.85;font-size:14px;}
.thread-tag{font-size:10px;color:#1264a3;font-weight:600;margin-bottom:6px;}
</style>
</head>
<body>
<div id="root"></div>
<script>
const stages = [
  {
    label:"Notification received",
    pct:25,
    insight:{title:"What just happened",text:"The moment the dealer confirmed the WhatsApp claim, a Salesforce Platform Event fired. Einstein for Slack (Agentforce action) composed the rich notification card — pulling the AI summary from Data Cloud and the claim fields from Automotive Cloud — and posted it to #warranty-approvals in under 5 seconds. Approvers also receive a Slack notification (channel + optional DM) so nothing is missed."},
    messages:[
      {sender:"Electra Warranty Bot",time:"2:14 PM",av:"av-bot",avTxt:"EW",isApp:true,parts:[
        {type:"notify"},
        {type:"text",text:"New warranty claim submitted — prior authorisation required."},
        {type:"attach",title:"Claim WC-2024-084471 · Sunrise Motors, Mumbai",rows:[
          {l:"VIN",v:"WBA3A5G59DNP26858",c:""},
          {l:"Vehicle",v:"Electra E-Pulse 300 · 2022",c:""},
          {l:"Warranty",v:"Active — expires Dec 2025",c:"green"},
          {l:"Mileage",v:"28,450 km",c:""},
          {l:"Fault",v:"Battery range degradation ~40%",c:""},
          {l:"Part",v:"EV-HVB-3201 · HV Battery Pack",c:""},
          {l:"Labour",v:"3.5 hrs",c:""},
          {l:"Est. cost",v:"₹ 1,24,000",c:"amber"},
        ]},
        {type:"risk",level:"low",label:"Risk score: Low"},
        {type:"ai",label:"AI summary",text:"This is a first-time battery range claim on a 2022 E-Pulse 300 with 28,450 km — well within the 5-year / 1,00,000 km battery warranty. No prior claims on this VIN. The degradation pattern is consistent with 3 similar approved claims on this model in the last 90 days. Part EV-HVB-3201 is fully covered. Recommended action: Approve."},
        {type:"suggestions",stageKey:"initial"},
        {type:"actions",stage:0}
      ]}
    ]
  },
  {
    label:"Approver asks a question",
    pct:50,
    insight:{title:"Intelligent assistant in action",text:"The approver can @mention the agent in the thread, use suggested questions, or type freely. The Agentforce Approver Assistant — connected to Data Cloud and Automotive Cloud — answers with cited evidence. Each reply stays in-thread for audit."},
    messages:[
      {sender:"Electra Warranty Bot",time:"2:14 PM",av:"av-bot",avTxt:"EW",isApp:true,parts:[
        {type:"notify"},
        {type:"text",text:"New warranty claim submitted — prior authorisation required."},
        {type:"attach",title:"Claim WC-2024-084471 · Sunrise Motors, Mumbai",rows:[
          {l:"VIN",v:"WBA3A5G59DNP26858",c:""},
          {l:"Warranty",v:"Active — expires Dec 2025",c:"green"},
          {l:"Fault",v:"Battery range degradation ~40%",c:""},
          {l:"Part",v:"EV-HVB-3201 · HV Battery Pack",c:""},
          {l:"Est. cost",v:"₹ 1,24,000",c:"amber"},
        ]},
        {type:"risk",level:"low",label:"Risk score: Low"},
        {type:"ai",label:"AI summary",text:"First-time claim on this VIN. Degradation consistent with 3 similar approved cases. Part EV-HVB-3201 fully covered. Recommended: Approve."},
        {type:"suggestions",stageKey:"thread"},
        {type:"actions",stage:1}
      ]},
      {sender:"Riya Mehta",time:"2:16 PM",av:"av-human",avTxt:"RM",isApp:false,parts:[
        {type:"thread-label"},
        {type:"text",text:"@Electra Warranty Agent Has this dealer had repeated claims for the same part in the last 6 months?"}
      ]},
      {sender:"Electra Warranty Agent",time:"2:16 PM",av:"av-bot",avTxt:"EW",isApp:true,parts:[
        {type:"qa",
          q:"Has this dealer had repeated claims for the same part in the last 6 months?",
          a:"Sunrise Motors has submitted 2 prior claims for Part EV-HVB-3201 in the last 6 months — both were approved. This is within the normal dealer frequency (network average: 1.8 per dealer per 6 months). No anomaly flagged.",
          cite:"Source: Data Cloud · Claim history · Automotive Cloud warranty policy v4.2"},
        {type:"composer"}
      ]}
    ]
  },
  {
    label:"Approver approves in Slack",
    pct:75,
    insight:{title:"One-click approval triggers Salesforce Flow",text:"Clicking Approve fires an Agentforce Slack Action that calls a Salesforce Flow. The Flow updates the Warranty Claim record status to Approved, logs the approver's identity and timestamp, and triggers a WhatsApp notification back to Sunrise Motors — all without the approver leaving Slack."},
    messages:[
      {sender:"Riya Mehta",time:"2:17 PM",av:"av-human",avTxt:"RM",isApp:false,parts:[
        {type:"text",text:"Thanks — looks good. Approving this one."},
        {type:"approve-action"}
      ]},
      {sender:"Electra Warranty Bot",time:"2:17 PM",av:"av-bot",avTxt:"EW",isApp:true,parts:[
        {type:"decision",title:"Claim WC-2024-084471 Approved",text:"Approved by Riya Mehta · 2:17 PM · Salesforce record updated · Dealer notified via WhatsApp"}
      ]}
    ]
  },
  {
    label:"Dealer notified",
    pct:100,
    insight:{title:"Closed loop in under 3 minutes",text:"From claim submission on WhatsApp to approval notification back to the dealer — the entire cycle completed in under 3 minutes. The Warranty Claim record in Automotive Cloud now carries a full audit trail: submission timestamp, approver identity, AI summary, and decision rationale."},
    messages:[
      {sender:"Electra Warranty Bot",time:"2:17 PM",av:"av-bot",avTxt:"EW",isApp:true,parts:[
        {type:"decision",title:"Claim WC-2024-084471 Approved",text:"Approved by Riya Mehta · 2:17 PM · Salesforce record updated"}
      ]},
      {sender:"Electra Warranty Bot",time:"2:17 PM",av:"av-bot",avTxt:"EW",isApp:true,parts:[
        {type:"text",text:"Dealer notification sent via WhatsApp (Digital Engagement):"},
        {type:"wa-preview",text:"Hi Sunrise Motors — your warranty claim WC-2024-084471 for the Electra E-Pulse 300 (EV-HVB-3201) has been approved. You may proceed with the repair. Claim record updated in the Electra dealer portal."}
      ]}
    ]
  }
];

let cur = 0;

const suggestionSets = {
  initial: [
    { t: "Any repeat claims for this VIN in the last 12 months?" },
    { t: "Is part EV-HVB-3201 still under national stock cover?" },
    { t: "Does mileage void battery warranty for this model?" },
    { t: "Compare to similar approvals this quarter." }
  ],
  thread: [
    { t: "Has this dealer had repeated claims for the same part in 6 months?" },
    { t: "Show telematics / SoH for this battery." },
    { t: "What is the labour cap for this dealer tier?" },
    { t: "Flag if policy exception needed." }
  ]
};

function renderSuggestions(key){
  const items = suggestionSets[key] || suggestionSets.initial;
  const pills = items.map((x,i)=>`<button type="button" class="suggest-pill" title="Example prompt — wire to Agentforce">${x.t}</button>`).join("");
  return `<div class="suggest-label">Suggested questions</div><div class="suggest-row">${pills}</div><p class="suggest-hint">Approvers tap a suggestion or type in the thread; @mention routes the question to the warranty agent.</p>`;
}

function renderNotify(){
  return `<div class="notify-banner">
    <span class="notify-icon" aria-hidden="true">🔔</span>
    <div class="notify-body">
      <p class="notify-title">Notification sent</p>
      <p class="notify-sub">Posted to <strong style="color:#d1d2d3;">#warranty-approvals</strong> · Slack pushed to assigned approvers (desktop &amp; mobile). Badge: unread until acted.</p>
    </div>
  </div>`;
}

function renderComposer(){
  return `<div class="composer-mock">
    <div class="thread-tag">Reply in thread</div>
    <div class="composer-inner">
      <div class="composer-fake">Ask another question or type <span style="color:#1264a3;">@Electra Warranty Agent</span> …</div>
      <div class="composer-send" title="Send">➤</div>
    </div>
  </div>`;
}

function renderPart(p, stageIdx){
  if(p.type==="notify") return renderNotify();
  if(p.type==="suggestions") return renderSuggestions(p.stageKey || "initial");
  if(p.type==="thread-label") return `<p class="thread-tag">Thread · Question to agent</p>`;
  if(p.type==="composer") return renderComposer();
  if(p.type==="text") return `<p class="msg-text">${p.text}</p>`;
  if(p.type==="attach"){
    const rows = p.rows.map(r=>`<div style="display:flex;gap:6px;font-size:12px;margin-bottom:3px;"><span style="color:#8a8a8a;flex-shrink:0;width:120px;">${r.l}</span><span class="f-val ${r.c}">${r.v}</span></div>`).join("");
    return `<div class="card"><div class="card-title">${p.title}</div><div class="fields-grid">${rows}</div></div>`;
  }
  if(p.type==="risk"){
    return `<div class="risk-row"><span class="risk-label">Risk score</span><span class="risk-pill risk-low">${p.label}</span><div class="risk-bar-wrap"><div class="risk-bar" style="width:18%;background:#2e844a;"></div></div><span style="font-size:10px;color:#72767d;">18/100</span></div>`;
  }
  if(p.type==="ai"){
    return `<div class="ai-box"><div class="ai-header"><div class="ai-icon">AI</div><span class="ai-label">${p.label}</span></div><p class="ai-text">${p.text}</p><div class="ai-rec"><span class="ai-rec-label">Recommended action</span><span class="ai-rec-val">Approve · High confidence</span></div></div>`;
  }
  if(p.type==="actions"){
    if(stageIdx >= 2) return `<div style="display:inline-flex;align-items:center;gap:8px;background:#1a3a22;border-radius:4px;padding:5px 10px;"><div style="width:8px;height:8px;border-radius:50%;background:#4a9c5d;"></div><span style="font-size:12px;color:#4a9c5d;font-weight:600;">Approved by Riya Mehta</span></div>`;
    return `<div class="action-row"><button class="btn btn-approve" onclick="go(1)">Approve</button><button class="btn btn-reject">Reject</button><button class="btn btn-ask" onclick="go(1)">Ask a question</button></div>`;
  }
  if(p.type==="qa"){
    return `<div class="qa-block"><p class="qa-q">${p.q}</p><p class="qa-a">${p.a}</p><p class="qa-cite">${p.cite}</p></div>`;
  }
  if(p.type==="approve-action"){
    return `<div style="display:inline-flex;align-items:center;gap:8px;background:#1a3a22;border-radius:4px;padding:5px 10px;margin-top:4px;"><div style="width:8px;height:8px;border-radius:50%;background:#4a9c5d;"></div><span style="font-size:12px;color:#4a9c5d;font-weight:600;">Clicked: Approve</span></div>`;
  }
  if(p.type==="decision"){
    return `<div class="decision-block"><p class="decision-title">${p.title}</p><p class="decision-text">${p.text}</p></div>`;
  }
  if(p.type==="wa-preview"){
    return `<div class="wa-preview"><p class="wa-preview-label">WhatsApp · Digital Engagement</p><p class="wa-preview-text">${p.text}</p></div>`;
  }
  return "";
}

function renderMsg(m, stageIdx){
  const body = m.parts.map(p=>renderPart(p, stageIdx)).join("");
  return `<div class="msg-row">
    <div class="avatar ${m.av}">${m.avTxt}</div>
    <div style="flex:1;min-width:0;">
      <div class="sender-line">
        <span class="sender-name">${m.sender}</span>
        ${m.isApp?'<span class="sender-app">App</span>':""}
        <span class="sender-time">${m.time}</span>
      </div>
      ${body}
    </div>
  </div>`;
}

function render(){
  const s = stages[cur];
  const isLast = cur === stages.length - 1;
  const msgs = s.messages.map(m=>renderMsg(m, cur)).join(`<div class="divider-line"></div>`);

  document.getElementById("root").innerHTML = `
    <div class="step-header">
      <span class="step-title">Stage ${cur+1} of ${stages.length} — ${s.label}</span>
      <span class="step-pct">${s.pct}%</span>
    </div>
    <div class="progress-wrap"><div class="progress-fill" style="width:${s.pct}%"></div></div>
    <div class="slack-shell">
      <div class="topbar">
        <span class="topbar-hash">#</span>
        <span class="topbar-name">warranty-approvals</span>
        <span class="topbar-badge">Agentforce</span>
        <span class="topbar-right">3 members · notifications on</span>
      </div>
      <div class="body">
        <div class="ctx-bar">
          <div class="ctx-dot"></div>
          <span class="ctx-txt">Platform Event received &nbsp;·&nbsp;</span>
          <span class="ctx-val">Warranty_Claim_Submitted__e</span>
          <span class="ctx-txt" style="margin-left:auto;">Posted 4 sec after submission</span>
        </div>
        ${msgs}
      </div>
    </div>
    <div class="insight-chip">
      <div class="insight-lbl">${s.insight.title}</div>
      ${s.insight.text}
    </div>
    <div class="step-nav">
      <button class="step-btn" onclick="go(-1)" ${cur===0?"disabled":""}>Previous</button>
      ${!isLast
        ? `<button class="step-btn primary" onclick="go(1)">Next &rarr;</button>`
        : `<button class="step-btn primary" style="background:#0070d2;border-color:#0070d2;">Workflow complete — WC-2024-084471 Approved</button>`
      }
    </div>`;
}

function go(d){ cur=Math.max(0,Math.min(stages.length-1,cur+d)); render(); }
render();
</script>
</body>
</html>
